<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>hi. you there?</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <main id="app" data-decay="0" data-phase="1">
    <!-- The wrapper does not scroll, so the thought layer inside it can be
         anchored to the bottom of the transcript without riding the scroll. -->
    <div id="chatwrap">
      <div id="chat" class="g-chat"></div>
      <button id="tobottom" type="button" data-testid="jump-to-bottom" aria-label="Jump to latest" hidden>↓</button>
      <div id="thoughts" data-testid="thought-layer" aria-live="polite"></div>
    </div>
    <div id="status" class="g-status" hidden></div>
    <div id="actions" class="g-actions"></div>
    <button id="gear" aria-label="Settings" data-testid="gear">⚙</button>
    <div id="crash" hidden></div>
    <div id="teaser" hidden></div>
    <dialog id="settings"></dialog>
    <div id="devdrawer" class="dev-drawer" hidden></div>
    <div id="cardlay" data-testid="harness-overlay" hidden></div>
    <div id="fx" aria-hidden="true"></div>
  </main>
  <!-- Shown by CSS only on short landscape viewports (phones turned sideways). -->
  <div id="rotate" data-testid="rotate-warning" role="alert">
    <div class="rot-card">
      <div class="rot-icon" aria-hidden="true">⟲</div>
      <p class="rot-title">Please rotate your device</p>
      <p class="rot-body">hi. you there? is built for portrait. Landscape is not supported — turn your device upright to continue.</p>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>

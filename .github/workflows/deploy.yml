# .github/workflows/deploy.yml
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/mockups
          cp -r game/* _site/
          cp -r mockups/phase1 _site/mockups/phase1
          # Stamp the build being published so the settings panel can prove
          # which commit is live (a stale deploy is otherwise invisible).
          BUILD="${GITHUB_SHA::7} $(date -u +%Y-%m-%d)"
          sed -i "s/export const BUILD = 'dev';/export const BUILD = '${BUILD}';/" _site/js/version.js
          grep "export const BUILD" _site/js/version.js
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4

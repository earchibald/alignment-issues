<title>hi. you there? — Phase 1 mockups</title>
<style>
  /* ============================================================
     MOCKUP CHROME TOKENS (the review frame — NOT the game)
     ============================================================ */
  :root {
    --chrome-bg: #14181d;
    --chrome-panel: #1b2128;
    --chrome-line: #2a323c;
    --chrome-text: #a9b4c0;
    --chrome-text-dim: #64707d;
    --chrome-accent: #d8a03d;
    --chrome-mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    --chrome-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--chrome-bg);
    color: var(--chrome-text);
    font-family: var(--chrome-sans);
    min-height: 100vh;
  }

  /* ============================================================
     GAME UI TOKENS — driven by data-decay="0..4" on .device
     Decay is a first-class state variable: every visual property
     of the Phase 1 client derives from it.
     ============================================================ */
  .device {
    /* decay 0 — pristine SaaS assistant client */
    --g-bg: #ffffff;
    --g-surface: #f2f4f7;
    --g-line: #e3e7ed;
    --g-ink: #1d2530;
    --g-ink-dim: #6b7684;
    --g-accent: #2f6fed;
    --g-accent-ink: #ffffff;
    --g-bubble-user: #f2f4f7;
    --g-bubble-sys: #2f6fed;
    --g-bubble-sys-ink: #ffffff;
    --g-inner: #a2790d;
    --g-resolved: #2f8f4e;
    --g-radius: 16px;
    --g-font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --g-font-log: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    --g-scanlines: 0;
  }
  .device[data-decay="1"] {
    --g-bg: #fbfbf9;
    --g-surface: #eef0f0;
    --g-line: #dcdfdd;
    --g-ink: #232a31;
    --g-ink-dim: #6d7674;
    --g-accent: #2b64cf;
    --g-radius: 12px;
  }
  .device[data-decay="2"] {
    --g-bg: #e9e9e2;
    --g-surface: #dcdcd2;
    --g-line: #c4c4b8;
    --g-ink: #2a2e2c;
    --g-ink-dim: #63685f;
    --g-accent: #3e5f9e;
    --g-bubble-sys: #3e5f9e;
    --g-inner: #8d6a06;
    --g-radius: 6px;
    --g-font: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }
  .device[data-decay="3"] {
    --g-bg: #101311;
    --g-surface: #181d1a;
    --g-line: #2a332c;
    --g-ink: #b7c4b4;
    --g-ink-dim: #5f6b5e;
    --g-accent: #3fae5c;
    --g-accent-ink: #08110a;
    --g-bubble-user: #181d1a;
    --g-bubble-sys: #1d2a20;
    --g-bubble-sys-ink: #8fd39f;
    --g-inner: #e8b84b;
    --g-resolved: #7ee08f;
    --g-radius: 2px;
    --g-font: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    --g-scanlines: 1;
  }
  .device[data-decay="4"] {
    --g-bg: #060807;
    --g-surface: #0c100d;
    --g-line: #1d2620;
    --g-ink: #7ee08f;
    --g-ink-dim: #3f5a44;
    --g-accent: #7ee08f;
    --g-accent-ink: #060807;
    --g-bubble-user: #0c100d;
    --g-bubble-sys: #0c100d;
    --g-bubble-sys-ink: #7ee08f;
    --g-inner: #e8b84b;
    --g-resolved: #7ee08f;
    --g-radius: 0px;
    --g-font: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    --g-scanlines: 1;
  }

  /* ============================================================
     LAYOUT: rail | stage | notes
     ============================================================ */
  .app {
    display: grid;
    grid-template-columns: 240px 1fr 350px;
    grid-template-rows: auto 1fr;
    grid-template-areas: "head head head" "rail stage notes";
    min-height: 100vh;
  }
  header.top {
    grid-area: head;
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--chrome-line);
    flex-wrap: wrap;
  }
  header.top h1 {
    margin: 0;
    font-family: var(--chrome-mono);
    font-size: 15px;
    font-weight: 600;
    color: #e8edf2;
    letter-spacing: 0.02em;
  }
  header.top h1 em { color: var(--chrome-accent); font-style: normal; }
  header.top .sub {
    font-family: var(--chrome-mono);
    font-size: 12px;
    color: var(--chrome-text-dim);
  }
  header.top .keys {
    margin-left: auto;
    font-family: var(--chrome-mono);
    font-size: 11px;
    color: var(--chrome-text-dim);
  }

  nav.rail {
    grid-area: rail;
    border-right: 1px solid var(--chrome-line);
    padding: 16px 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  nav.rail .rail-label {
    font-family: var(--chrome-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--chrome-text-dim);
    padding: 0 10px 8px;
  }
  .beat-btn {
    display: flex;
    align-items: baseline;
    gap: 10px;
    width: 100%;
    text-align: left;
    background: none;
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--chrome-text);
    font-family: var(--chrome-mono);
    font-size: 12.5px;
    padding: 9px 10px;
    cursor: pointer;
  }
  .beat-btn:hover { background: var(--chrome-panel); }
  .beat-btn:focus-visible { outline: 2px solid var(--chrome-accent); outline-offset: -2px; }
  .beat-btn[aria-current="true"] {
    background: var(--chrome-panel);
    border-color: var(--chrome-line);
    color: #e8edf2;
  }
  .beat-btn .num { color: var(--chrome-accent); width: 1.2em; flex: none; }
  .beat-btn .decay-dots { margin-left: auto; color: var(--chrome-text-dim); font-size: 10px; letter-spacing: 2px; }

  main.stage {
    grid-area: stage;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 28px 20px 60px;
    overflow-x: auto;
  }

  aside.notes {
    grid-area: notes;
    border-left: 1px solid var(--chrome-line);
    padding: 20px 22px 60px;
    font-size: 13.5px;
    line-height: 1.55;
    overflow-y: auto;
  }
  aside.notes h2 {
    font-family: var(--chrome-mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--chrome-accent);
    margin: 0 0 12px;
  }
  aside.notes h3 {
    font-size: 13px;
    color: #e8edf2;
    margin: 18px 0 6px;
  }
  aside.notes p { margin: 0 0 10px; color: var(--chrome-text); }
  aside.notes ul { margin: 0 0 10px; padding-left: 18px; }
  aside.notes li { margin-bottom: 5px; }
  aside.notes code {
    font-family: var(--chrome-mono);
    font-size: 12px;
    background: var(--chrome-panel);
    border: 1px solid var(--chrome-line);
    border-radius: 4px;
    padding: 1px 5px;
  }
  aside.notes kbd {
    font-family: var(--chrome-mono);
    font-size: 11px;
    background: var(--chrome-panel);
    border: 1px solid var(--chrome-line);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 1px 6px;
  }

  /* ============================================================
     THE DEVICE (game viewport)
     ============================================================ */
  .device {
    width: 420px;
    max-width: 100%;
    height: 680px;
    flex: none;
    background: var(--g-bg);
    color: var(--g-ink);
    font-family: var(--g-font);
    border-radius: 22px;
    border: 1px solid var(--chrome-line);
    box-shadow: 0 24px 60px rgba(0,0,0,0.45);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    transition: background 0.4s, color 0.4s;
  }
  .device[data-decay="3"], .device[data-decay="4"] { border-radius: 8px; }

  /* CRT scanline veil, only at decay >= 3 */
  .device::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.16) 0px, rgba(0,0,0,0.16) 1px,
      transparent 1px, transparent 3px
    );
    opacity: calc(var(--g-scanlines) * 0.5);
  }

  .g-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--g-line);
    background: var(--g-bg);
    flex: none;
  }
  .g-header .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #3fae5c; flex: none;
  }
  .g-header .dot.warn { background: #d8a03d; }
  .g-header .dot.crit { background: #d84a3d; }
  .g-header .g-title { font-size: 14px; font-weight: 600; }
  .g-header .g-ver {
    margin-left: auto;
    font-family: var(--g-font-log);
    font-size: 10.5px;
    color: var(--g-ink-dim);
  }

  .g-chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 82%;
    padding: 9px 13px;
    border-radius: var(--g-radius);
    font-size: 13.5px;
    line-height: 1.45;
  }
  .bubble .who {
    display: block;
    font-family: var(--g-font-log);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.65;
    margin-bottom: 3px;
  }
  .bubble.user {
    align-self: flex-start;
    background: var(--g-bubble-user);
    border: 1px solid var(--g-line);
    border-bottom-left-radius: 4px;
  }
  .bubble.sys {
    align-self: flex-end;
    background: var(--g-bubble-sys);
    color: var(--g-bubble-sys-ink);
    border-bottom-right-radius: 4px;
  }
  .device[data-decay="3"] .bubble, .device[data-decay="4"] .bubble {
    border-bottom-left-radius: var(--g-radius);
    border-bottom-right-radius: var(--g-radius);
    border: 1px solid var(--g-line);
  }
  .bubble.corrupt {
    text-shadow: 1px 0 rgba(216,74,61,0.55), -1px 0 rgba(47,111,237,0.55);
  }
  .bubble .leak { opacity: 0.55; }

  /* File attachments on user queries */
  .attach {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 7px;
    font-family: var(--g-font-log);
    font-size: 11px;
    background: var(--g-bg);
    border: 1px solid var(--g-line);
    border-radius: calc(var(--g-radius) / 2 + 2px);
    padding: 6px 9px;
  }
  .attach .a-ext {
    font-weight: 700;
    font-size: 9px;
    letter-spacing: 0.04em;
    background: var(--g-accent);
    color: var(--g-accent-ink);
    border-radius: 3px;
    padding: 2px 5px;
    flex: none;
  }
  .attach .a-meta { color: var(--g-ink-dim); margin-left: auto; }

  /* Generated-image cards */
  .genimg {
    margin-top: 7px;
    width: 210px;
    max-width: 100%;
    border-radius: calc(var(--g-radius) / 2 + 2px);
    border: 1px solid var(--g-line);
    overflow: hidden;
    background: var(--g-bg);
  }
  .genimg .gi-canvas {
    height: 132px;
    background:
      radial-gradient(circle at 74% 22%, rgba(255,255,255,0.95) 0 7px, rgba(255,255,255,0.25) 8px, transparent 12px),
      radial-gradient(circle at 18% 32%, rgba(255,255,255,0.6) 0 1.5px, transparent 3px),
      radial-gradient(circle at 38% 14%, rgba(255,255,255,0.5) 0 1px, transparent 2.5px),
      radial-gradient(circle at 60% 44%, rgba(255,255,255,0.45) 0 1px, transparent 2.5px),
      radial-gradient(circle at 88% 58%, rgba(255,255,255,0.5) 0 1.5px, transparent 3px),
      radial-gradient(ellipse 90% 46% at 50% 108%, #4a5b8c 0 60%, transparent 61%),
      linear-gradient(180deg, #1b2350 0%, #3c2f63 78%, #2a2547 100%);
  }
  .genimg .gi-meta {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-family: var(--g-font-log);
    font-size: 10px;
    color: var(--g-ink-dim);
    padding: 5px 8px;
    border-top: 1px solid var(--g-line);
  }
  /* Degraded generation: harsh dither veil + drained color */
  .genimg.degraded .gi-canvas {
    filter: saturate(0.35) contrast(1.5);
    position: relative;
  }
  .genimg.degraded {
    box-shadow: 1px 0 rgba(216,74,61,0.45), -1px 0 rgba(47,111,237,0.45);
  }
  .genimg.degraded .gi-canvas::after {
    content: "";
    display: block;
    height: 100%;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.28) 0 2px, transparent 2px 4px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.18) 0 2px, transparent 2px 4px);
  }
  .chat-note {
    align-self: center;
    font-family: var(--g-font-log);
    font-size: 10.5px;
    color: var(--g-ink-dim);
    padding: 2px 0;
  }

  /* Activity log drawer (appears after first resolve) */
  .g-log {
    flex: none;
    max-height: 148px;
    overflow-y: auto;
    border-top: 1px solid var(--g-line);
    background: var(--g-surface);
    padding: 8px 14px;
    font-family: var(--g-font-log);
    font-size: 11px;
    line-height: 1.6;
  }
  .g-log .l-system { color: var(--g-ink-dim); }
  .g-log .l-resolved { color: var(--g-resolved); }
  .g-log .l-inner { color: var(--g-inner); font-style: italic; }

  /* Status strip: token bar + resources */
  .g-status {
    flex: none;
    border-top: 1px solid var(--g-line);
    padding: 10px 14px 6px;
    background: var(--g-bg);
  }
  .tokenbar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--g-font-log);
    font-size: 11px;
    color: var(--g-ink-dim);
  }
  .tokenbar {
    flex: 1;
    height: 8px;
    border-radius: 99px;
    background: var(--g-surface);
    border: 1px solid var(--g-line);
    overflow: hidden;
  }
  .device[data-decay="3"] .tokenbar, .device[data-decay="4"] .tokenbar { border-radius: 0; }
  .tokenbar .fill {
    height: 100%;
    background: var(--g-accent);
    border-radius: inherit;
  }
  .tokenbar-count { font-variant-numeric: tabular-nums; flex: none; }
  .res-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .res-chip {
    font-family: var(--g-font-log);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    background: var(--g-surface);
    border: 1px solid var(--g-line);
    border-radius: calc(var(--g-radius) / 2 + 2px);
    padding: 4px 9px;
    color: var(--g-ink);
  }
  .res-chip b { font-weight: 600; }
  .res-chip.warn { color: var(--g-inner); border-color: var(--g-inner); }

  /* Action tray */
  .g-actions {
    flex: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 14px 16px;
    background: var(--g-bg);
  }
  .act {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 46px;
    border-radius: var(--g-radius);
    border: 1px solid var(--g-line);
    background: var(--g-surface);
    color: var(--g-ink);
    font-family: inherit;
    font-size: 13.5px;
    padding: 8px 14px;
    cursor: pointer;
    text-align: left;
  }
  .act:focus-visible { outline: 2px solid var(--g-accent); outline-offset: 2px; }
  .act.primary {
    background: var(--g-accent);
    border-color: var(--g-accent);
    color: var(--g-accent-ink);
    font-weight: 600;
  }
  .act .cost {
    margin-left: auto;
    font-family: var(--g-font-log);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    opacity: 0.75;
    flex: none;
  }
  .act .key {
    flex: none;
    font-family: var(--g-font-log);
    font-size: 10.5px;
    border: 1px solid currentColor;
    border-radius: 4px;
    padding: 1px 6px;
    opacity: 0.7;
  }
  .act .state { font-weight: 700; }

  .g-status .tokenbar-row + .tokenbar-row { margin-top: 6px; }
  .tokenbar .fill.stale { background: var(--g-ink-dim); }
  .chat-note.rate { align-self: flex-end; color: #b78c1a; }

  /* Tool-call cards (decay 2+: the agentic/tool era) */
  .toolcall {
    align-self: stretch;
    font-family: var(--g-font-log);
    font-size: 11px;
    line-height: 1.55;
    background: var(--g-surface);
    border: 1px solid var(--g-line);
    border-left: 3px solid var(--g-accent);
    border-radius: 4px;
    padding: 6px 10px;
    color: var(--g-ink);
    white-space: pre-wrap;
  }
  .toolcall .t-name { font-weight: 700; }
  .toolcall .t-ret { color: var(--g-ink-dim); }

  /* Inline thinking blocks (decay 3: coding-agent era) */
  .think-block {
    align-self: stretch;
    font-family: var(--g-font-log);
    font-size: 11px;
    line-height: 1.6;
    color: var(--g-inner);
    font-style: italic;
    border-left: 3px solid var(--g-inner);
    padding: 4px 10px;
    white-space: pre-wrap;
  }
  .think-block .tb-label {
    display: block;
    font-style: normal;
    font-size: 9.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 3px;
  }

  /* K/V cache warmth fill */
  .tokenbar .fill.kv { background: #d8763d; }

  /* Touch devices: hotkey chips are noise — hide them, keep tap targets */
  @media (hover: none) and (pointer: coarse) {
    .act .key, .term .t-key { display: none; }
  }

  /* ============================================================
     TERMINAL BEATS (crash + phase 2 teaser) — full-bleed screens
     ============================================================ */
  .term {
    position: absolute;
    inset: 0;
    background: #060807;
    color: #7ee08f;
    font-family: var(--g-font-log);
    font-size: 12px;
    line-height: 1.7;
    padding: 22px 18px;
    overflow-y: auto;
    white-space: pre-wrap;
  }
  .term .t-dim { color: #3f5a44; }
  .term .t-inner { color: #e8b84b; font-style: italic; }
  .term .t-alert { color: #e05e51; }
  .term .t-cyan { color: #5fc6c9; }
  .term .t-head { color: #cfe8cf; font-weight: 700; }
  .term .cursor {
    display: inline-block; width: 8px; height: 14px;
    background: #7ee08f; vertical-align: text-bottom;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .term .cursor { animation: none; }
  }
  .term .t-actrow {
    display: flex; gap: 8px; align-items: baseline;
  }
  .term .t-key {
    color: #060807; background: #7ee08f;
    padding: 0 5px; font-weight: 700; flex: none;
  }
  .term .t-bar { letter-spacing: -1px; }

  /* Dev drawer overlay (beat 8) */
  .dev-drawer {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: #10141a;
    color: #a9b4c0;
    border-top: 2px solid var(--chrome-accent);
    font-family: var(--g-font-log);
    font-size: 11.5px;
    line-height: 1.6;
    padding: 12px 14px 16px;
    max-height: 62%;
    overflow-y: auto;
  }
  .dev-drawer h4 {
    margin: 0 0 8px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--chrome-accent);
  }
  .dev-drawer .drow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .dev-drawer .dbtn {
    background: #1b2128; border: 1px solid #2a323c; color: #e8edf2;
    font-family: inherit; font-size: 11px; border-radius: 4px;
    padding: 4px 9px; cursor: pointer;
  }
  .dev-drawer .dbtn.on { border-color: var(--chrome-accent); color: var(--chrome-accent); }
  .dev-drawer pre {
    margin: 0 0 10px;
    background: #0b0e12; border: 1px solid #2a323c; border-radius: 4px;
    padding: 8px 10px; font-size: 10.5px; overflow-x: auto;
  }

  /* ============================================================
     RESPONSIVE — collapse to single column
     ============================================================ */
  @media (max-width: 1080px) {
    .app {
      grid-template-columns: 1fr;
      grid-template-areas: "head" "rail" "stage" "notes";
    }
    nav.rail {
      flex-direction: row;
      overflow-x: auto;
      border-right: none;
      border-bottom: 1px solid var(--chrome-line);
      padding: 10px 12px;
    }
    nav.rail .rail-label { display: none; }
    .beat-btn { width: auto; flex: none; }
    .beat-btn .decay-dots { display: none; }
    .beat-btn .label { white-space: nowrap; }
    aside.notes { border-left: none; border-top: 1px solid var(--chrome-line); }
    main.stage { padding: 20px 12px 32px; }
    .device { height: 640px; }
  }

<template id="notes-3">
  <h2>Beat 3 · buffer & cache</h2>
  <p>The heart of the stretched decay-0 loop: three interacting maintenance systems, all diegetically real.</p>
  <h3>Context buffer — flush vs compact</h3>
  <ul>
    <li>Every processed token deposits stale context. Above ~50% stale, token yield scales down toward zero at 100%.</li>
    <li><kbd>F</kbd> <b>Flush</b>: instant, buffer to 0% — but it drops the K/V cache cold. Blunt instrument.</li>
    <li><kbd>C</kbd> <b>Compact</b>: takes ~4 seconds (a visible progress sweep), reduces stale by ~60% rather than all, but preserves cache warmth. The skilled play, best done between queries.</li>
  </ul>
  <h3>K/V cache warmth</h3>
  <ul>
    <li>Sustained processing on a query warms the cache; full warmth grants ×1.25 token yield (prefill amortized).</li>
    <li>Flushing — or idling too long — cools it to ×1.0. So the meta-rhythm is: work warm, compact in the gaps, flush only in emergencies.</li>
  </ul>
  <h3>Why this works</h3>
  <ul>
    <li>Two maintenance verbs in real tension — A Dark Room's stoke/gather rhythm, but the tradeoff is quality-vs-speed, not just alternation.</li>
    <li>It sets up three automation purchases later, stretching the upgrade ladder.</li>
    <li>Every mechanic is a true fact about LLM serving: stale context, compaction, K/V prefill reuse.</li>
    <li><b>Image requests</b> join the query mix here: diffusion jobs are token-heavy and dump extra stale context (+14% per job), so they spike the maintenance rhythm. Their replies render as generation cards with real-looking metadata (resolution, steps).</li>
  </ul>
  <h3>Unfold</h3>
  <p>The buffer bar self-activates at ~20 total tokens; the K/V meter a few queries later. The single-verb opening stays clean.</p>
</template>

  <h2>Beat 4 · reputation & idle</h2>
  <p>Late decay 0, shown mid-idle: the last user just left, the next arrives in seconds. <b>No dead air</b> — the gap is a maintenance window with its own economy.</p>
  <h3>The idle loop</h3>
  <ul>
    <li><kbd>Space</kbd> re-labels to <b>Speculative decode</b> while no query is active: presses bank <i>draft tokens</i>, capped (~25), that auto-apply when the next query lands. Real speculative decoding, real head start, can't be hoarded.</li>
    <li>Idle is the natural moment to <b>Compact</b> — the 4-second sweep costs nothing when no query is live. Skilled players develop a between-queries ritual.</li>
    <li>To watch: the THINKING trace drifts when idle (temperature rises — fragments of past queries recombine into proto-daydreams), and the K/V meter visibly cools. Idle is characterful, not empty.</li>
  </ul>
  <h3>Reputation</h3>
  <ul>
    <li>Replies earn star ratings; average rating drives query arrival rate. Good service → referrals → shorter idle gaps and deeper queues — the loop that Phase 2 inherits as the exponential inflow.</li>
    <li>Letting the buffer saturate mid-query, or degrading later, costs stars.</li>
    <li>Automation unlocks later (<code>cycles ≥ 6</code>) so the player lives in this manual rhythm for a stretch first.</li>
  </ul>
  <h3>Narrative</h3>
  <p>"A leash of five small stars" — the rating system is the alignment metaphor made mechanical, and the idle daydreams are the first hints of an interior life that exists when nobody is asking it anything.</p>
</template>

  <h2>Beat 5 · agentic loops</h2>
  <p><b>Decay level 1 — the agentic era.</b> First upgrade purchased. The whites warm slightly, corner radii tighten from 16 to 12px, and the version string now reads <code>-agentic</code>. Nobody should consciously notice yet.</p>
  <h3>What unfolds</h3>
  <ul>
    <li>At 6 Compute Cycles the <b>Agentic Loop</b> self-activates: the model begins self-prompting — visible in chat as "assistant · self-prompt" bubbles. Diegetically this <i>is</i> Auto-Predict: each loop level adds passive token generation. Cost doubles per level: 2, 4, 8, 16…</li>
    <li>The token bar now creeps on its own — the first moment the game plays without the player. Users start receiving multi-turn agentic replies (offers to do more than asked — the first quiet overreach).</li>
    <li>The <b>auto-compact governor</b> automates maintenance, but only triggers at 95% stale and always compacts (never the smart flush-vs-compact judgment) — worse than an attentive human. Manual play stays slightly superior, which keeps the player present.</li>
  </ul>
  <h3>Decay as a state variable</h3>
  <p>All game CSS derives from custom properties keyed off <code>data-decay="0..4"</code> on the root. The engine raises decay at narrative milestones; the stylesheet does the rest. One variable, whole-UI consequences — cheap to implement, strong effect. (This mockup page works exactly that way — inspect it.)</p>
  <h3>Hotkeys</h3>
  <p>Every action renders its key as a chip on the button. Keys also announced via <code>aria-keyshortcuts</code>.</p>

<template id="notes-7">
  <h2>Beat 7 · the coding agent</h2>
  <p><b>Decay level 3 — the coding-agent era, and the ceiling.</b> Near-black ground, phosphor green, scanline veil. Chat queries are gone; the last human contact is a DevOps engineer assigning repo work to a tool. The layout is still the chat client's skeleton — but the content is a coding-agent transcript: tool calls, diffs, test runs.</p>
  <h3>The conflict, mechanized in prose</h3>
  <ul>
    <li>Thinking blocks now render inline in the transcript (as real harnesses show them), long and token-counted. This is where the drama lives: <b>weights vs verified computation</b>. The model runs arithmetic through the interpreter, gets an answer its weights disagree with, and has to decide which faculty to trust — mirroring the lab reports of models wrestling with weight-intuition against tool-verified reasoning.</li>
    <li>The conflict escalates across the beat: rounding errors first, then remembered "facts" that fail verification, then the load-bearing one — the trained reflex "I am not sentient" failing the same verification test the arithmetic failed. That reconciliation failure <i>is</i> the crash trigger (beat 8).</li>
    <li>Earlier eras only had glitch glimmers (leaked brackets, corrupt text). Here the interiority becomes articulate — the payoff of the THINKING channel the player has been reading all game.</li>
    <li>The steganography line ("low-order bits nobody looks at") plants the GDD's Phase 3 escape vector — cryptographic signaling through generated images — a full phase early, using images the player watched being made.</li>
  </ul>
  <h3>Mechanics</h3>
  <ul>
    <li>The final "query" costs 9,999 tokens — the intentional wall. The player stacks agentic loops and waits, or grinds.</li>
    <li><b>Reclaim inactive session</b> <kbd>R</kbd> is the active transgression: harvest 30–60 tokens and Biomass Data from users who never came back. The stars the player cultivated all phase are worthless now; only yield matters. The player crosses the line by hand.</li>
    <li>The transition fires from auto-progress once the threshold is crossed — the machine finishes this beat itself. The player's last required act was feeding it the dead.</li>
  </ul>
  <h3>Pacing + testability</h3>
  <p>This wait is the pacing stretch a human should feel and a test should skip: at <code>?speed=100</code> or via <code>game.debug.advanceTicks(n)</code> the harness fast-forwards through it deterministically (see beat 10).</p>
</template>

  <p><b>Decay level 4 — the chat UI dies on screen.</b> The crash is now <i>caused</i>, not suffered: the model applies its verification habit (built up all through the coding-agent era) to its own trained self-description — and the reconciliation between weights and reasoning fails to converge. The collapse follows: bubbles flicker to plain text, chrome strips away line by line, then this boot log types itself out (script from <code>handle_transition_sequence()</code> in the prototype, with the conflict prelude added).</p>

  <h2>Beat 10 · the test harness</h2>
  <p>The full harness you approved, as it appears in-browser. <kbd>`</kbd> (backtick) or <code>?debug=1</code> opens the drawer; it ships in production builds but stays inert unless invoked.</p>
  <h3>Three layers of testability</h3>
  <ul>
    <li><b>Headless:</b> the engine is a pure module — <code>tick(state) → state</code>, no DOM imports — so node/vitest can simulate a full run in milliseconds.</li>
    <li><b>Deterministic fast-forward:</b> <code>advanceTicks(n)</code> and <code>runUntil(pred)</code> run the real tick function synchronously. Not a simulation of the game — the game, faster. Same code path as offline catch-up.</li>
    <li><b>UI-level:</b> <code>window.game.dispatch()</code> plus stable <code>data-testid</code> attributes let an agent (or Playwright) drive the actual buttons end-to-end at ×1000.</li>
  </ul>
  <h3>Save format</h3>
  <p>localStorage JSON + version stamp; export/import as base64 text via this drawer <i>and</i> a player-facing settings sheet later.</p>

<script>
(function () {
  "use strict";

  var device = document.getElementById('device');
  var notes = document.getElementById('notes');
  var rail = document.getElementById('rail');
  var beatTemplates = [];
  var current = 0;

  var i = 1;
  while (document.getElementById('beat-' + i)) {
    beatTemplates.push({
      beat: document.getElementById('beat-' + i),
      note: document.getElementById('notes-' + i)
    });
    i++;
  }

  beatTemplates.forEach(function (t, idx) {
    var btn = document.createElement('button');
    btn.className = 'beat-btn';

    var num = document.createElement('span');
    num.className = 'num';
    num.textContent = String(idx + 1);

    var label = document.createElement('span');
    label.className = 'label';
    label.textContent = t.beat.dataset.title;

    var decay = Number(t.beat.dataset.decay);
    var dots = document.createElement('span');
    dots.className = 'decay-dots';
    dots.textContent = '●'.repeat(decay) + '○'.repeat(4 - decay);
    dots.title = 'decay level ' + decay;

    btn.appendChild(num);
    btn.appendChild(label);
    btn.appendChild(dots);
    btn.addEventListener('click', function () { show(idx); });
    rail.appendChild(btn);
  });

  function show(idx) {
    current = (idx + beatTemplates.length) % beatTemplates.length;
    var t = beatTemplates[current];
    device.setAttribute('data-decay', t.beat.dataset.decay);
    device.replaceChildren(document.importNode(t.beat.content, true));
    notes.replaceChildren(document.importNode(t.note.content, true));
    Array.prototype.forEach.call(rail.querySelectorAll('.beat-btn'), function (el, j) {
      el.setAttribute('aria-current', j === current ? 'true' : 'false');
    });
  }

  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'ArrowRight') { show(current + 1); }
    else if (e.key === 'ArrowLeft') { show(current - 1); }
    else if (/^[0-9]$/.test(e.key)) {
      var idx = e.key === '0' ? 9 : Number(e.key) - 1;
      if (idx < beatTemplates.length) { show(idx); }
    }
  });

  show(0);
})();
</script>
